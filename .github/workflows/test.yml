name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      # A real run on a real Docker host. It may report problems (exit 1);
      # what matters is that it doesn't crash (exit 2 or a panic).
      - name: Run against the runner's Docker
        if: runner.os == 'Linux'
        run: |
          go build -o dockdoctor .
          ./dockdoctor -v || [ $? -eq 1 ]
          ./dockdoctor -json > report.json || [ $? -eq 1 ]
          python3 -m json.tool report.json > /dev/null
      # Docker Engine's default json-file driver keeps logs without a limit,
      # and the runner is amd64: check both on a real daemon.
      - name: Logs and architecture checks on a real daemon
        if: runner.os == 'Linux'
        run: |
          docker run -d --name dd-logs busybox:1.36 sleep 120
          docker run -d --name dd-arm --platform linux/arm64 busybox:1.36 sleep 120 || true
          ./dockdoctor -v || [ $? -eq 1 ]
          ./dockdoctor -json > report.json || [ $? -eq 1 ]
          python3 - <<'PY'
          import json
          checks = {f["check"]: f for f in json.load(open("report.json"))["findings"]}
          assert "logs" in checks and "dd-logs" in checks["logs"]["title"], checks
          print("logs finding:", checks["logs"]["title"])
          print("arch finding:", checks.get("arch", {}).get("title", "none (no arm64 emulation on this runner)"))
          PY
